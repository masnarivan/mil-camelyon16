[project]
name = "mil-camelyon16"
version = "0.1.0"
description = "Slide-level metastasis detection on CAMELYON16 with attention-based MIL on Phikon features, and a look at domain shift between centres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wsi-embeddings",   # tiling, labels and Phikon embedding code from project 1
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "certifi",
]

[tool.uv.sources]
# Pinned to a commit so results stay reproducible; bump `rev` when wsi changes upstream.
wsi-embeddings = { git = "https://github.com/masnarivan/wsi-embeddings", rev = "197c5151f1f2c1ff5bb7aeef340d7f682f2c0361" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mil"]
